schema_version: "1.0"

preset:
  id: "use-cases"
  name: "Use Case Specifications"
  version: "1.0.0"
  description: "Use a linked use case as the feature specification source of truth"

requires:
  speckit_version: ">=1.0.7"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Feature specification pointer to the authoritative use case"
    - type: "template"
      name: "use-case-template"
      file: "templates/use-case-template.md"
      description: "Use case specification format"
    - type: "command"
      name: "speckit.specify"
      file: "commands/specify.md"
      description: "Create a use case and feature specification pointer"
      strategy: "prepend"
    - type: "command"
      name: "speckit.clarify"
      file: "commands/clarify.md"
      description: "Clarify the linked authoritative use case"
      strategy: "prepend"
    - type: "command"
      name: "speckit.plan"
      file: "commands/consume.md"
      description: "Use the linked use case for planning"
      strategy: "prepend"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/consume.md"
      description: "Use the linked use case for task generation"
      strategy: "prepend"
    - type: "command"
      name: "speckit.analyze"
      file: "commands/consume.md"
      description: "Use the linked use case for analysis"
      strategy: "prepend"
    - type: "command"
      name: "speckit.checklist"
      file: "commands/consume.md"
      description: "Use the linked use case for checklists"
      strategy: "prepend"
    - type: "command"
      name: "speckit.implement"
      file: "commands/consume.md"
      description: "Use the linked use case for implementation"
      strategy: "prepend"
    - type: "command"
      name: "speckit.converge"
      file: "commands/consume.md"
      description: "Use the linked use case for convergence"
      strategy: "prepend"

tags:
  - "use-cases"
  - "specification"
